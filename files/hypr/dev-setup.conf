# Managed by ~/dev-setup (steps/40-hypr-config.sh). Re-running the step overwrites this file;
# put personal tweaks in hyprland.conf instead.
# Format: hyprland.conf syntax for Ubuntu's Hyprland 0.53 (not the Lua config of 0.55+).
# Keymap ported from Omarchy's defaults; Omarchy shell actions map to Noctalia (noctalia msg ...).
# This file owns the whole keymap: hyprland.conf is created without Hyprland's default binds.
# Every bind uses the "d" flag (bindd = MODS, KEY, Description, dispatcher, args) so SUPER+K can list it.

# --- Environment ---
# mise's shared .NET root, so editors started from the launcher can find the SDK.
env = DOTNET_ROOT,@HOME@/.local/share/mise/dotnet-root

# --- Autostart ---
exec-once = noctalia
exec-once = systemctl --user start hyprpolkitagent

# --- Variables ---
$ipc = noctalia msg
$terminal = @TERMINAL@
$browser = vivaldi-stable
$workBrowser = microsoft-edge-stable
$fileManager = nautilus --new-window
$shims = @HOME@/.local/share/mise/shims
$helpers = @HOME@/.local/bin

# --- Applications ---
bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER ALT, RETURN, Tmux, exec, $terminal tmux new-session -A -s main
bindd = SUPER SHIFT, RETURN, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --incognito
bindd = SUPER SHIFT CTRL, B, Work browser (Edge), exec, $workBrowser
bindd = SUPER SHIFT, F, File manager, exec, $fileManager
bindd = SUPER SHIFT, N, Editor, exec, $terminal $shims/nvim
bindd = SUPER CTRL, T, Activity, exec, $terminal btop

# --- Noctalia: launcher, menus, panels ---
bindd = SUPER, K, Keybindings, exec, $helpers/dev-hypr-keybinds
bindd = SUPER, SPACE, Launcher, exec, $ipc panel-toggle launcher
bindd = SUPER ALT, SPACE, Apps menu, exec, $ipc panel-toggle launcher
bindd = SUPER CTRL, E, Emojis, exec, $ipc panel-toggle launcher /emo
bindd = SUPER, ESCAPE, Session menu, exec, $ipc panel-toggle session
bindld = , XF86PowerOff, Session menu, exec, $ipc panel-toggle session
bindd = SUPER CTRL, K, Noctalia settings, exec, $ipc settings-toggle
bindd = SUPER CTRL, V, Clipboard manager, exec, $ipc panel-toggle clipboard
bindd = SUPER CTRL, SPACE, Background switcher, exec, $ipc panel-toggle wallpaper
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, $ipc bar-toggle
bindd = SUPER CTRL, L, Lock system, exec, $ipc session lock
bindd = ALT, TAB, Window switcher, exec, $ipc window-switcher hold
bindd = ALT SHIFT, TAB, Window switcher, exec, $ipc window-switcher hold

# Control center (Omarchy's panel keys open the matching tab)
bindd = SUPER CTRL, O, Control center, exec, $ipc panel-toggle control-center
bindd = SUPER CTRL, A, Audio, exec, $ipc panel-toggle control-center audio
bindd = SUPER CTRL, B, Bluetooth, exec, $ipc panel-toggle control-center bluetooth
bindd = SUPER CTRL, W, Network, exec, $ipc panel-toggle control-center network
bindd = SUPER CTRL, D, Display, exec, $ipc panel-toggle control-center monitor
bindd = SUPER CTRL, P, Power, exec, $ipc panel-toggle control-center power
bindd = SUPER CTRL ALT, D, Calendar, exec, $ipc panel-toggle control-center calendar
bindd = SUPER CTRL ALT, W, Weather, exec, $ipc panel-toggle control-center weather
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, $ipc panel-toggle control-center power

# Toggles
bindd = SUPER CTRL, N, Toggle nightlight, exec, $ipc nightlight-force-toggle
bindd = SUPER CTRL, I, Toggle locking on idle, exec, $ipc caffeine-toggle

# --- Notifications (Noctalia can't dismiss a single one, so both dismiss keys clear all) ---
bindd = SUPER, comma, Dismiss notifications, exec, $ipc notification-clear-active
bindd = SUPER SHIFT, comma, Dismiss all notifications, exec, $ipc notification-clear-active
bindd = SUPER CTRL, comma, Toggle silencing notifications, exec, $ipc notification-dnd-toggle
bindd = SUPER ALT, comma, Invoke last notification, exec, $ipc notification-invoke-latest
bindd = SUPER SHIFT ALT, comma, Open notification history, exec, $ipc panel-toggle control-center notifications

# --- Screenshot ---
bindd = , PRINT, Screenshot, exec, $ipc screenshot-region

# --- Universal clipboard (Ctrl/Shift+Insert work in terminals and GUI apps) ---
bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = SUPER, X, Universal cut, sendshortcut, CTRL, X,

# --- Windows ---
bindd = SUPER, W, Close window, killactive,
bindd = SUPER, T, Toggle window floating/tiling, togglefloating,
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER ALT, F, Full width, fullscreen, 1
bindd = SUPER, J, Toggle window split, togglesplit,
bindd = SUPER, P, Pseudo window, pseudo,
bindd = SUPER, O, Pop window out (float & pin), exec, $helpers/dev-hypr-pop
bindd = SUPER, BACKSPACE, Toggle window transparency, setprop, active opaque toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, $helpers/dev-hypr-gaps
bindd = SUPER CTRL, Z, Zoom in, exec, $helpers/dev-hypr-zoom in
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, $helpers/dev-hypr-zoom reset

# Focus and swap
bindd = SUPER, LEFT, Focus on left window, movefocus, l
bindd = SUPER, RIGHT, Focus on right window, movefocus, r
bindd = SUPER, UP, Focus on above window, movefocus, u
bindd = SUPER, DOWN, Focus on below window, movefocus, d
bindd = SUPER SHIFT, LEFT, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, UP, Swap window up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Swap window down, swapwindow, d
bindd = CTRL ALT, TAB, Focus on next monitor, focusmonitor, +1
bindd = CTRL ALT SHIFT, TAB, Focus on previous monitor, focusmonitor, -1

# Resize (minus = left/up, equal = right/down; ALT a little, CTRL a lot)
bindd = SUPER, minus, Expand window left, resizeactive, -100 0
bindd = SUPER, equal, Shrink window left, resizeactive, 100 0
bindd = SUPER SHIFT, minus, Shrink window up, resizeactive, 0 -100
bindd = SUPER SHIFT, equal, Expand window down, resizeactive, 0 100
bindd = SUPER ALT, minus, Expand window left a little, resizeactive, -25 0
bindd = SUPER ALT, equal, Shrink window left a little, resizeactive, 25 0
bindd = SUPER SHIFT ALT, minus, Shrink window up a little, resizeactive, 0 -25
bindd = SUPER SHIFT ALT, equal, Expand window down a little, resizeactive, 0 25
bindd = SUPER CTRL, minus, Expand window left a lot, resizeactive, -300 0
bindd = SUPER CTRL, equal, Shrink window left a lot, resizeactive, 300 0
bindd = SUPER SHIFT CTRL, minus, Shrink window up a lot, resizeactive, 0 -300
bindd = SUPER SHIFT CTRL, equal, Expand window down a lot, resizeactive, 0 300

# Mouse
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# --- Workspaces ---
bindd = SUPER, 1, Switch to workspace 1, workspace, 1
bindd = SUPER, 2, Switch to workspace 2, workspace, 2
bindd = SUPER, 3, Switch to workspace 3, workspace, 3
bindd = SUPER, 4, Switch to workspace 4, workspace, 4
bindd = SUPER, 5, Switch to workspace 5, workspace, 5
bindd = SUPER, 6, Switch to workspace 6, workspace, 6
bindd = SUPER, 7, Switch to workspace 7, workspace, 7
bindd = SUPER, 8, Switch to workspace 8, workspace, 8
bindd = SUPER, 9, Switch to workspace 9, workspace, 9
bindd = SUPER, 0, Switch to workspace 10, workspace, 10
bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move window to workspace 10, movetoworkspace, 10
bindd = SUPER SHIFT ALT, 1, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, 2, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, 3, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, 4, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, 5, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, 6, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, 7, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, 8, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, 9, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, 0, Move window silently to workspace 10, movetoworkspacesilent, 10
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER CTRL, TAB, Former workspace, workspace, previous
bindd = SUPER, mouse_down, Scroll active workspace forward, workspace, e+1
bindd = SUPER, mouse_up, Scroll active workspace backward, workspace, e-1
bindd = SUPER SHIFT ALT, LEFT, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT ALT, RIGHT, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT ALT, UP, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT ALT, DOWN, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Scratchpad
bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER ALT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# --- Groups ---
bindd = SUPER, G, Toggle window grouping, togglegroup,
bindd = SUPER ALT, G, Move active window out of group, moveoutofgroup,
bindd = SUPER ALT, LEFT, Move window to group on left, moveintogroup, l
bindd = SUPER ALT, RIGHT, Move window to group on right, moveintogroup, r
bindd = SUPER ALT, UP, Move window to group on top, moveintogroup, u
bindd = SUPER ALT, DOWN, Move window to group on bottom, moveintogroup, d
bindd = SUPER ALT, TAB, Next window in group, changegroupactive, f
bindd = SUPER ALT SHIFT, TAB, Previous window in group, changegroupactive, b
bindd = SUPER CTRL, LEFT, Move grouped window focus left, changegroupactive, b
bindd = SUPER CTRL, RIGHT, Move grouped window focus right, changegroupactive, f
bindd = SUPER ALT, mouse_down, Next window in group, changegroupactive, f
bindd = SUPER ALT, mouse_up, Previous window in group, changegroupactive, b
bindd = SUPER ALT, 1, Switch to group window 1, changegroupactive, 1
bindd = SUPER ALT, 2, Switch to group window 2, changegroupactive, 2
bindd = SUPER ALT, 3, Switch to group window 3, changegroupactive, 3
bindd = SUPER ALT, 4, Switch to group window 4, changegroupactive, 4
bindd = SUPER ALT, 5, Switch to group window 5, changegroupactive, 5

# --- Media keys (work on the lock screen; volume/brightness repeat while held) ---
bindeld = , XF86AudioRaiseVolume, Volume up, exec, $ipc volume-up
bindeld = , XF86AudioLowerVolume, Volume down, exec, $ipc volume-down
bindld  = , XF86AudioMute, Mute, exec, $ipc volume-mute
bindld  = , XF86AudioMicMute, Mute microphone, exec, $ipc mic-mute
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, $ipc volume-up 1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, $ipc volume-down 1
bindld  = SHIFT, XF86AudioMute, Switch audio output, exec, $ipc panel-toggle control-center audio

bindeld = , XF86MonBrightnessUp, Brightness up, exec, $ipc brightness-up
bindeld = , XF86MonBrightnessDown, Brightness down, exec, $ipc brightness-down
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, brightnessctl -q set 1%+ && $ipc brightness-osd
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, brightnessctl -q set 1%- && $ipc brightness-osd
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, brightnessctl -q set 100% && $ipc brightness-osd
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, brightnessctl -q set 1% && $ipc brightness-osd

bindeld = , XF86KbdBrightnessUp, Keyboard brightness up, exec, $ipc keyboard-backlight-up
bindeld = , XF86KbdBrightnessDown, Keyboard brightness down, exec, $ipc keyboard-backlight-down
bindld  = , XF86KbdLightOnOff, Keyboard backlight toggle, exec, $ipc keyboard-backlight-toggle

bindld = , XF86AudioPlay, Play, exec, $ipc media toggle
bindld = , XF86AudioPause, Pause, exec, $ipc media toggle
bindld = , XF86AudioNext, Next track, exec, $ipc media next
bindld = , XF86AudioPrev, Previous track, exec, $ipc media previous
bindld = ALT, XF86AudioPlay, Next track, exec, $ipc media next
bindld = ALT SHIFT, XF86AudioPlay, Previous track, exec, $ipc media previous
bindld = SHIFT, XF86AudioPlay, Switch media source, exec, $ipc media next-player
bindld = SHIFT, XF86AudioPause, Switch media source, exec, $ipc media next-player
