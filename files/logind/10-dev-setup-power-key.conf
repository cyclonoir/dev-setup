# Managed by ~/dev-setup (steps/40-hypr-config.sh).
# Let the desktop handle the power button: Hyprland opens Noctalia's session menu, and GNOME shows its
# own dialog. Without this, logind powers off immediately when the button is pressed under Hyprland.
# Holding the button for several seconds still forces the laptop off (handled by the firmware).
[Login]
HandlePowerKey=ignore
