<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Managed by ~/dev-setup (steps/15-fonts.sh). Makes JetBrainsMono Nerd Font the default monospace
     font (foot uses "monospace" unless configured otherwise), with Nerd Font symbols as a fallback. -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
